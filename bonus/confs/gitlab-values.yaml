global:
  edition: ce
  hosts:
    domain: mjeannin.com
    https: false
    ssh: false

  # Chart 10.x (GitLab 19) defaults to Gateway API + a bundled Envoy Gateway.
  # We already have Traefik from k3s, so go back to a plain Ingress.
  gatewayApi:
    enabled: false
    installEnvoy: false
    configureCertmanager: false
  ingress:
    enabled: true
    provider: traefik
    class: traefik
    configureCertmanager: false

  # Chart 10.x no longer bundles PostgreSQL or Redis: both are deployed
  # beforehand from confs/gitlab-deps.yaml.
  psql:
    host: postgresql.gitlab.svc
    port: 5432
    database: gitlabhq_production
    username: gitlab
    connectTimeout: 30
    password:
      secret: gitlab-postgresql-password
      key: postgresql-password
  redis:
    host: redis.gitlab.svc
    port: 6379
    auth:
      enabled: true
      secret: gitlab-redis-secret
      key: secret

  kas:
    enabled: false

  # Chart 10.x also dropped the bundled MinIO, and these features require S3
  # object storage when enabled. None of them is needed to host a Git repo.
  appConfig:
    lfs:
      enabled: false
    artifacts:
      enabled: false
    uploads:
      enabled: false
    packages:
      enabled: false

installCertmanager: false

nginx-ingress:
  enabled: false

prometheus:
  install: false

gitlab-runner:
  install: false

registry:
  enabled: false

gitlab:
    gitaly:
        resources:
            requests:
                memory: 256Mi
                cpu: 50m
            limits:
                memory: 512Mi
    gitlab-shell:
        enabled: false
    webservice:
        replicaCount: 1
        workerProcesses: 1
        minReplicas: 1
        maxReplicas: 1
        resources:
            requests:
                memory: 900Mi
                cpu: 100m
            limits:
                memory: 1.5Gi
    sidekiq:
        concurrency: 5
        replicas: 1
        resources:
            requests:
                memory: 256Mi
                cpu: 100m
    toolbox:
        resources:
            requests:
                memory: 256Mi
                cpu: 50m
