# Argo CD Helm values.
#
# The stock install.yaml ships every optional component and serves the UI over
# HTTPS with a self-signed certificate. Installing through Helm instead lets us
# drop what this project never uses and turn the knobs that matter: plain HTTP
# for the UI, a 60s reconciliation loop, and probes that tolerate a busy VM.

# Small requests: this is a single-node k3d cluster, and the scheduler only
# needs to be told these pods are cheap.
server:
  resources:
    requests: {memory: 64Mi, cpu: 50m}
  # The chart's default probes allow 1s per check. During provisioning the VM is
  # pulling images and importing them into the node, and a check that misses
  # three times in a row gets the container killed.
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
repoServer:
  resources:
    requests: {memory: 64Mi, cpu: 50m}
  # Same, and this is the one that actually crash-looped: its liveness check
  # (/healthz?full=true) is the slowest of the lot, and a dead repo-server is
  # what makes the UI say "failed to generate manifest ... connection refused".
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
redis:
  resources:
    requests: {memory: 32Mi, cpu: 10m}
controller:
  resources:
    requests: {memory: 128Mi, cpu: 100m}

# Off: an SSO provider and a notification engine, neither of which is used here.
dex:
  enabled: false
notifications:
  enabled: false

# The ApplicationSet controller has no `enabled` flag as of chart 10.x -- the
# Deployment is always rendered. Zero replicas is the only way to not run it.
applicationSet:
  replicas: 0

configs:
  params:
    # Serve the UI over plain HTTP. The port-forward then targets port 80 of
    # svc/argocd-server and the browser needs no certificate exception.
    server.insecure: true
  cm:
    # Default is 180s. One minute makes the "push to GitHub -> new pod" demo
    # short enough to watch.
    timeout.reconciliation: 60s
